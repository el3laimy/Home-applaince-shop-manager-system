name: Desktop Release Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-build.yml"
      - "Frontend/alikhlas_pos/**"
  push:
    branches:
      - main
      - fix/v2-installment-returns
      - 'codex/**'
    paths:
      - ".github/workflows/windows-build.yml"
      - "Frontend/alikhlas_pos/**"

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/alikhlas_pos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze lib test
      - run: flutter test
      - name: Verify process lock
        run: python3 tool/check_application_lock.py "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart"

  build-windows:
    needs: verify
    name: Build Windows release
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Frontend/alikhlas_pos

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze v2
        run: dart analyze lib/v2 lib/main.dart test/v2

      - name: Verify process lock on Windows
        run: python tool/check_application_lock.py "$env:FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart.exe"

      - name: Build Windows
        run: flutter build windows --release --dart-define=APP_GIT_SHA=$env:GITHUB_SHA

      - name: Install NSIS compiler
        shell: pwsh
        run: >
          winget install --id NSIS.NSIS --exact --version 3.12 --source winget
          --silent --accept-package-agreements --accept-source-agreements

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read application version" }
          .\tool\build_windows_installer.ps1 `
            -SourceDirectory 'build\windows\x64\runner\Release' `
            -OutputDirectory 'build\windows\x64\runner\Installer' `
            -Version $version

      - name: Verify Windows installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'build\windows\x64\runner\Installer\ALIkhlasPOS-Setup-*-x64.exe' | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -lt 1MB) { throw "Windows installer was not produced" }
          Write-Host "Windows installer: $($installer.FullName) ($($installer.Length) bytes)"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alikhlas-pos-windows
          path: Frontend/alikhlas_pos/build/windows/x64/runner/Release
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alikhlas-pos-windows-installer
          path: Frontend/alikhlas_pos/build/windows/x64/runner/Installer/ALIkhlasPOS-Setup-*-x64.exe
          if-no-files-found: error

  build-linux:
    needs: verify
    name: Build Linux release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/alikhlas_pos

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release --dart-define=APP_GIT_SHA=$GITHUB_SHA

      - name: Build Debian installer
        run: |
          version="$(awk '/^version:/ {split($2, parts, "+"); print parts[1]; exit}' pubspec.yaml)"
          test -n "$version"
          bash tool/build_linux_deb.sh build/linux/x64/release/bundle build/linux/x64/release/package "$version"

      - name: Verify Debian installer
        run: |
          deb="$(find build/linux/x64/release/package -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          bash tool/verify_linux_deb.sh "$deb"

      - name: Upload Linux bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alikhlas-pos-linux
          path: Frontend/alikhlas_pos/build/linux/x64/release/bundle
          if-no-files-found: error

      - name: Upload Debian installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alikhlas-pos-linux-deb
          path: Frontend/alikhlas_pos/build/linux/x64/release/package/*.deb
          if-no-files-found: error

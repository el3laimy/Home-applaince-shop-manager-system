name: Desktop Release Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-build.yml"
      - "Frontend/alikhlas_pos/**"
  push:
    branches:
      - main
      - fix/v2-installment-returns
      - 'codex/**'
    tags:
      - 'v*'
    paths:
      - ".github/workflows/windows-build.yml"
      - "Frontend/alikhlas_pos/**"

concurrency:
  group: desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/alikhlas_pos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze lib test
      - run: flutter test
      - name: Verify process lock
        run: python3 tool/check_application_lock.py "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart"

  build-windows:
    needs: verify
    name: Build Windows release
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Frontend/alikhlas_pos

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze v2
        run: dart analyze lib/v2 lib/main.dart test/v2

      - name: Verify process lock on Windows
        run: python tool/check_application_lock.py "$env:FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart.exe"

      - name: Build Windows
        run: flutter build windows --release --dart-define=APP_GIT_SHA=$env:GITHUB_SHA

      - name: Test Windows signing helper
        shell: pwsh
        timeout-minutes: 5
        run: |
          $passwordText = 'temporary-signing-test-password'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'alikhlas-signing-test.pfx'
          $signedCopy = Join-Path $env:RUNNER_TEMP 'alikhlas-signing-test.exe'
          $rsa = [Security.Cryptography.RSA]::Create(2048)
          $certificate = $null
          $request = [Security.Cryptography.X509Certificates.CertificateRequest]::new(
            'CN=ALIkhlasPOS CI signing test',
            $rsa,
            [Security.Cryptography.HashAlgorithmName]::SHA256,
            [Security.Cryptography.RSASignaturePadding]::Pkcs1
          )
          try {
            $codeSigningOid = [Security.Cryptography.OidCollection]::new()
            $codeSigningOid.Add(
              [Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3')
            ) | Out-Null
            $request.CertificateExtensions.Add(
              [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new(
                $codeSigningOid,
                $false
              )
            )
            $certificate = $request.CreateSelfSigned(
              [DateTimeOffset]::UtcNow.AddMinutes(-5),
              [DateTimeOffset]::UtcNow.AddDays(1)
            )
            [IO.File]::WriteAllBytes(
              $certificatePath,
              $certificate.Export(
                [Security.Cryptography.X509Certificates.X509ContentType]::Pfx,
                $passwordText
              )
            )
            Copy-Item `
              'build\windows\x64\runner\Release\alikhlas_pos.exe' `
              $signedCopy
            $env:WINDOWS_SIGNING_CERTIFICATE_BASE64 = [Convert]::ToBase64String(
              [IO.File]::ReadAllBytes($certificatePath)
            )
            $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD = $passwordText
            .\tool\sign_windows_release.ps1 `
              -Files @($signedCopy) `
              -TimestampUrl '' `
              -AllowUntrustedCertificate
          } finally {
            if ($null -ne $certificate) { $certificate.Dispose() }
            $rsa.Dispose()
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
            Remove-Item $signedCopy -Force -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_SIGNING_CERTIFICATE_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -ErrorAction SilentlyContinue
          }

      - name: Sign Windows application for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        timeout-minutes: 10
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          .\tool\sign_windows_release.ps1 `
            -Files @('build\windows\x64\runner\Release\alikhlas_pos.exe')

      - name: Install NSIS compiler
        shell: pwsh
        run: >
          winget install --id NSIS.NSIS --exact --version 3.12 --source winget
          --silent --accept-package-agreements --accept-source-agreements

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read application version" }
          .\tool\build_windows_installer.ps1 `
            -SourceDirectory 'build\windows\x64\runner\Release' `
            -OutputDirectory 'build\windows\x64\runner\Installer' `
            -IconFile 'windows\runner\resources\app_icon.ico' `
            -Version $version

          .\tool\build_windows_installer.ps1 `
            -SourceDirectory 'build\windows\x64\runner\Release' `
            -OutputDirectory 'build\windows\x64\runner\InstallerSmokeOld' `
            -IconFile 'windows\runner\resources\app_icon.ico' `
            -Version '0.0.1'

      - name: Verify Windows installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'build\windows\x64\runner\Installer\ALIkhlasPOS-Setup-*-x64.exe' | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -lt 1MB) { throw "Windows installer was not produced" }
          Write-Host "Windows installer: $($installer.FullName) ($($installer.Length) bytes)"

      - name: Sign and verify Windows installer for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        timeout-minutes: 10
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $installer = Get-ChildItem `
            'build\windows\x64\runner\Installer\ALIkhlasPOS-Setup-*-x64.exe' |
            Select-Object -First 1
          .\tool\sign_windows_release.ps1 -Files @($installer.FullName)

      - name: Accept Windows install, upgrade, removal, and reinstall
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $older = Get-ChildItem 'build\windows\x64\runner\InstallerSmokeOld\ALIkhlasPOS-Setup-0.0.1-x64.exe' | Select-Object -First 1
          $current = Get-ChildItem 'build\windows\x64\runner\Installer\ALIkhlasPOS-Setup-*-x64.exe' | Select-Object -First 1
          .\tool\smoke_windows_installer.ps1 `
            -OlderInstaller $older.FullName `
            -CurrentInstaller $current.FullName `
            -ExpectedVersion $version

      - name: Upload Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alikhlas-pos-windows
          path: Frontend/alikhlas_pos/build/windows/x64/runner/Release
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alikhlas-pos-windows-installer
          path: Frontend/alikhlas_pos/build/windows/x64/runner/Installer/ALIkhlasPOS-Setup-*-x64.exe
          if-no-files-found: error

  build-linux:
    needs: verify
    name: Build Linux release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/alikhlas_pos

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release --dart-define=APP_GIT_SHA=$GITHUB_SHA

      - name: Build Debian installer
        run: |
          version="$(awk '/^version:/ {split($2, parts, "+"); print parts[1]; exit}' pubspec.yaml)"
          test -n "$version"
          bash tool/build_linux_deb.sh build/linux/x64/release/bundle build/linux/x64/release/package "$version"
          bash tool/build_linux_deb.sh build/linux/x64/release/bundle build/linux/x64/release/package-smoke-old "0.0.1"

      - name: Verify Debian installer
        run: |
          deb="$(find build/linux/x64/release/package -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          bash tool/verify_linux_deb.sh "$deb"

      - name: Accept Linux install, upgrade, removal, and reinstall
        run: |
          older_deb="$(find build/linux/x64/release/package-smoke-old -maxdepth 1 -name '*.deb' -print -quit)"
          current_deb="$(find build/linux/x64/release/package -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$older_deb"
          test -n "$current_deb"
          bash tool/smoke_linux_installer.sh "$older_deb" "$current_deb"

      - name: Upload Linux bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alikhlas-pos-linux
          path: Frontend/alikhlas_pos/build/linux/x64/release/bundle
          if-no-files-found: error

      - name: Upload Debian installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alikhlas-pos-linux-deb
          path: Frontend/alikhlas_pos/build/linux/x64/release/package/*.deb
          if-no-files-found: error

  publish-draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify
      - build-windows
      - build-linux
    name: Publish signed draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Require tag to match the package version
        working-directory: Frontend/alikhlas_pos
        run: |
          package_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          test -n "$package_version"
          expected_tag="v${package_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $expected_tag." >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != 'tag' ]; then
            echo "Release tag $GITHUB_REF_NAME must be an annotated tag." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not part of origin/main." >&2
            exit 1
          fi

      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: alikhlas-pos-windows-installer
          path: release-assets

      - name: Download Debian installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: alikhlas-pos-linux-deb
          path: release-assets

      - name: Create and verify package checksums
        run: |
          mapfile -t packages < <(
            find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.deb' \) -print | sort
          )
          if [ "${#packages[@]}" -ne 2 ]; then
            echo "Expected exactly one Windows installer and one Debian package." >&2
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi
          sha256sum "${packages[@]}" | sed 's#release-assets/##' > release-assets/SHA256SUMS
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $GITHUB_REF_NAME." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.exe \
            release-assets/*.deb \
            release-assets/SHA256SUMS \
            --verify-tag \
            --draft \
            --title "ALIkhlasPOS ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES_V2.md
